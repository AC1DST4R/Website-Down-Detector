
name: Update Website Status

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/workflow.yml"

permissions:
  contents: write

concurrency:
  group: website-status-monitor
  cancel-in-progress: false

jobs:
  update-status:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Discover eligible public repositories
        shell: bash
        run: |
          set -euo pipefail

          OWNER="AC1DST4R"
          mkdir -p .status-work

          for PAGE in $(seq 1 10); do
            printf -v PAGE_FILE ".status-work/repos-%02d.json" "$PAGE"

            curl -fsSL \
              --retry 3 \
              --retry-delay 2 \
              "https://api.github.com/users/${OWNER}/repos?type=owner&per_page=100&sort=updated&page=${PAGE}" \
              -o "$PAGE_FILE"

            jq -e 'type == "array"' "$PAGE_FILE" >/dev/null

            COUNT="$(jq 'length' "$PAGE_FILE")"

            if [ "$COUNT" -lt 100 ]; then
              break
            fi
          done

          jq -s 'add' .status-work/repos-*.json \
            > .status-work/all-repos.json

          NOW="$(date -u +%s)"

          jq \
            --argjson now "$NOW" \
            '
            [
              .[]
              | select(.private == false)
              | select(.fork == false)
              | select(.archived == false)
              | select(.disabled == false)
              | select(
                  (
                    .name
                    | ascii_downcase
                    | gsub("[^a-z0-9]"; "")
                  ) as $n
                  | (
                      [
                        "historyautoclear",
                        "graphitev1",
                        "githubbulkupdater",
                        "fileencoderv2",
                        "gitchatv2",
                        "githubv2development"
                      ]
                      | index($n)
                    ) == null
                )
              | select(
                  (
                    .name
                    | ascii_downcase
                    | gsub("[^a-z0-9]"; "")
                  )
                  | test("^graphitev[0-9]+$") | not
                )
              | select(
                  (
                    (
                      .name + " " +
                      (.description // "") + " " +
                      ((.topics // []) | join(" "))
                    )
                    | test(
                        "(browser|firefox|chrome|extension|webextension|addon|add-on)";
                        "i"
                      )
                  ) | not
                )
              | select(
                  .pushed_at != null
                  and (
                    $now - (.pushed_at | fromdateiso8601)
                  ) <= 31536000
                )
            ]
            ' .status-work/all-repos.json \
            > eligible-repos.json

          echo "Eligible repositories:"
          jq -r '.[].name' eligible-repos.json

          echo "Total eligible repositories: $(jq 'length' eligible-repos.json)"

      - name: Check repositories and websites
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p public .status-work
          : > .status-work/status-lines.jsonl

          check_url() {
            local URL="$1"
            local CODE

            CODE="$(curl \
              --location \
              --silent \
              --show-error \
              --output /dev/null \
              --write-out '%{http_code}' \
              --connect-timeout 5 \
              --max-time 15 \
              "$URL" 2>/dev/null || true)"

            if [[ "$CODE" =~ ^[23][0-9][0-9]$ ]]; then
              printf 'Up'
            else
              printf 'Down'
            fi
          }

          while IFS= read -r REPO; do
            NAME="$(jq -r '.name' <<< "$REPO")"
            REPO_URL="$(jq -r '.html_url' <<< "$REPO")"
            HAS_PAGES="$(jq -r '.has_pages' <<< "$REPO")"

            if [ "$HAS_PAGES" = "true" ]; then
              if [ "$NAME" = "AC1DST4R.github.io" ]; then
                SITE_URL="https://ac1dst4r.github.io/"
              else
                SITE_URL="https://ac1dst4r.github.io/${NAME}/"
              fi

              WEBSITE_STATUS="$(check_url "$SITE_URL")"
            else
              SITE_URL=""
              WEBSITE_STATUS="Unknown"
            fi

            REPO_STATUS="$(check_url "$REPO_URL")"

            if [ "$REPO_STATUS" = "Down" ] || [ "$WEBSITE_STATUS" = "Down" ]; then
              OVERALL_STATUS="Down"
            elif [ "$REPO_STATUS" = "Up" ]; then
              OVERALL_STATUS="Up"
            else
              OVERALL_STATUS="Unknown"
            fi

            jq -cn \
              --arg name "$NAME" \
              --arg repo "$REPO_URL" \
              --arg url "$SITE_URL" \
              --arg repoStatus "$REPO_STATUS" \
              --arg websiteStatus "$WEBSITE_STATUS" \
              --arg status "$OVERALL_STATUS" \
              '{
                name: $name,
                repo: $repo,
                url: $url,
                repoStatus: $repoStatus,
                websiteStatus: $websiteStatus,
                status: $status
              }' >> .status-work/status-lines.jsonl

            echo "${NAME}: repository=${REPO_STATUS}, website=${WEBSITE_STATUS}"

          done < <(jq -c '.[]' eligible-repos.json)

          jq -s \
            --arg updated "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            '{
              updated: $updated,
              projects: .
            }' .status-work/status-lines.jsonl \
            > .status-work/new-status.json

          if [ -f public/status.json ]; then
            jq -S '.projects // []' public/status.json \
              > .status-work/old-projects.json
          else
            printf '[]\n' > .status-work/old-projects.json
          fi

          jq -S '.projects' .status-work/new-status.json \
            > .status-work/new-projects.json

          if ! cmp -s \
            .status-work/old-projects.json \
            .status-work/new-projects.json; then
            cp .status-work/new-status.json public/status.json
            echo "Project statuses changed."
          else
            echo "No project status changes detected."
          fi

      - name: Commit updated status
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public/status.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update website status"
          git push
