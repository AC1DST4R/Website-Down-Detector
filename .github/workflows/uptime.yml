name: Uptime Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl

      - name: Check sites & send alerts
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_KEY }}
        run: |
          set -e

          STATUS_FILE=public/status.json
          mkdir -p public

          if [ ! -f "$STATUS_FILE" ]; then
            echo '{"updated":"", "projects":[]}' > "$STATUS_FILE"
          fi

          tmpfile=$(mktemp)

          check() {
            NAME="$1"
            URL="$2"

            CODE=$(curl -o /dev/null -s -L -w "%{http_code}" --max-time 10 "$URL")

            if [ "$CODE" -ge 200 ] && [ "$CODE" -lt 400 ]; then
              STATUS="Up"
            else
              STATUS="Down"
            fi

            PREV=$(jq -r --arg name "$NAME" '.projects[] | select(.name==$name) | .status // empty' "$STATUS_FILE")

            if [ "$STATUS" != "$PREV" ]; then
              echo "State change for $NAME: $PREV → $STATUS"

              curl -X POST "$WEBHOOK_URL" \
                -H "Content-Type: application/json" \
                -d "$(jq -n \
                  --arg project "$NAME" \
                  --arg status "$STATUS" \
                  --arg url "$URL" \
                  --arg previous "$PREV" \
                  '{project:$project,status:$status,url:$url,previous:$previous}')"
            fi

            jq --arg name "$NAME" --arg url "$URL" --arg status "$STATUS" '
              .projects |= (map(select(.name != $name)) + [{
                name: $name,
                url: $url,
                status: $status
              }])
            ' "$STATUS_FILE" > "$tmpfile" && mv "$tmpfile" "$STATUS_FILE"
          }

          check "Apps" "https://ac1dst4r.github.io/Apps/"
          check "Web Ports" "https://ac1dst4r.github.io/Web-Ports"
          check "Minecraft Port" "https://ac1dst4r.github.io/Minecraft"
          check "C00lGUI" "https://ac1dst4r.github.io/C00lGUI"

          jq --arg t "$(date -u +%FT%TZ)" '.updated=$t' "$STATUS_FILE" > "$tmpfile" && mv "$tmpfile" "$STATUS_FILE"

      - name: Commit status.json
        run: |
          git config user.name "uptime-bot"
          git config user.email "bot@github.com"
          git add public/status.json
          git commit -m "Update status" || exit 0
          git push
