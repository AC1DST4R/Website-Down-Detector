
name: Update Website Status

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/workflow.yml"

permissions:
  contents: write

concurrency:
  group: website-status-monitor
  cancel-in-progress: false

jobs:
  update-status:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Discover eligible public repositories
        id: discover
        shell: bash
        run: |
          set -euo pipefail

          OWNER="AC1DST4R"
          ALL_REPOS="[]"

          for PAGE in $(seq 1 10); do
            RESPONSE="$(curl -fsSL \
              --retry 3 \
              --retry-delay 2 \
              "https://api.github.com/users/${OWNER}/repos?type=owner&per_page=100&sort=updated&page=${PAGE}")"

            jq -e 'type == "array"' >/dev/null <<< "$RESPONSE"

            COUNT="$(jq 'length' <<< "$RESPONSE")"
            ALL_REPOS="$(jq -cn \
              --argjson old "$ALL_REPOS" \
              --argjson new "$RESPONSE" \
              '$old + $new')"

            if [ "$COUNT" -lt 100 ]; then
              break
            fi
          done

          NOW="$(date -u +%s)"

          jq \
            --argjson now "$NOW" \
            '
            [
              .[]
              | select(.private == false)
              | select(.fork == false)
              | select(.archived == false)
              | select(.disabled == false)
              | select(
                  (
                    .name
                    | ascii_downcase
                    | gsub("[^a-z0-9]"; "")
                  ) as $n
                  | (
                      [
                        "historyautoclear",
                        "graphitev1",
                        "githubbulkupdater",
                        "fileencoderv2",
                        "gitchatv2",
                        "githubv2development"
                      ]
                      | index($n)
                    ) == null
                )
              | select(
                  (
                    .name
                    | ascii_downcase
                    | gsub("[^a-z0-9]"; "")
                  )
                  | test("^graphitev[0-9]+$") | not
                )
              | select(
                  (
                    (
                      .name + " " +
                      (.description // "") + " " +
                      ((.topics // []) | join(" "))
                    )
                    | test(
                        "(browser|firefox|chrome|extension|webextension|addon|add-on)";
                        "i"
                      )
                  ) | not
                )
              | select(
                  .pushed_at != null
                  and (
                    $now - (.pushed_at | fromdateiso8601)
                  ) <= 31536000
                )
            ]
            ' <<< "$ALL_REPOS" > eligible-repos.json

          echo "Eligible repositories:"
          jq -r '.[].name' eligible-repos.json

          echo "count=$(jq 'length' eligible-repos.json)" >> "$GITHUB_OUTPUT"

      - name: Check repositories and websites
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p public

          PROJECTS="[]"

          check_url() {
            local URL="$1"
            local CODE

            CODE="$(curl \
              --location \
              --silent \
              --show-error \
              --output /dev/null \
              --write-out '%{http_code}' \
              --connect-timeout 5 \
              --max-time 15 \
              "$URL" 2>/dev/null || true)"

            if [[ "$CODE" =~ ^[23][0-9][0-9]$ ]]; then
              printf 'Up'
            else
              printf 'Down'
            fi
          }

          while IFS= read -r REPO; do
            NAME="$(jq -r '.name' <<< "$REPO")"
            REPO_URL="$(jq -r '.html_url' <<< "$REPO")"
            HAS_PAGES="$(jq -r '.has_pages' <<< "$REPO")"

            if [ "$HAS_PAGES" = "true" ]; then
              if [ "$NAME" = "AC1DST4R.github.io" ]; then
                SITE_URL="https://ac1dst4r.github.io/"
              else
                SITE_URL="https://ac1dst4r.github.io/${NAME}/"
              fi

              WEBSITE_STATUS="$(check_url "$SITE_URL")"
            else
              SITE_URL=""
              WEBSITE_STATUS="Unknown"
            fi

            REPO_STATUS="$(check_url "$REPO_URL")"

            if [ "$REPO_STATUS" = "Down" ] || [ "$WEBSITE_STATUS" = "Down" ]; then
              OVERALL_STATUS="Down"
            elif [ "$REPO_STATUS" = "Up" ]; then
              OVERALL_STATUS="Up"
            else
              OVERALL_STATUS="Unknown"
            fi

            PROJECT="$(jq -cn \
              --arg name "$NAME" \
              --arg repo "$REPO_URL" \
              --arg url "$SITE_URL" \
              --arg repoStatus "$REPO_STATUS" \
              --arg websiteStatus "$WEBSITE_STATUS" \
              --arg status "$OVERALL_STATUS" \
              '{
                name: $name,
                repo: $repo,
                url: $url,
                repoStatus: $repoStatus,
                websiteStatus: $websiteStatus,
                status: $status
              }')"

            PROJECTS="$(jq -cn \
              --argjson old "$PROJECTS" \
              --argjson item "$PROJECT" \
              '$old + [$item]')"

            echo "${NAME}: repository=${REPO_STATUS}, website=${WEBSITE_STATUS}"

          done < <(jq -c '.[]' eligible-repos.json)

          NEW_STATUS="$(jq -cn \
            --arg updated "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --argjson projects "$PROJECTS" \
            '{
              updated: $updated,
              projects: $projects
            }')"

          if [ -f public/status.json ]; then
            OLD_PROJECTS="$(jq -cS '.projects // []' public/status.json)"
          else
            OLD_PROJECTS="[]"
          fi

          NEW_PROJECTS="$(jq -cS '.projects' <<< "$NEW_STATUS")"

          if [ "$OLD_PROJECTS" = "$NEW_PROJECTS" ] && [ -f public/status.json ]; then
            echo "No status changes detected. Keeping the existing status.json."
          else
            printf '%s\n' "$NEW_STATUS" | jq '.' > public/status.json
            echo "Status changes detected. Updated public/status.json."
          fi

      - name: Commit updated status
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public/status.json

          if git diff --cached --quiet; then
            echo "No file changes to commit."
            exit 0
          fi

          git commit -m "Update website status"
          git push
