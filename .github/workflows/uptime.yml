
name: Uptime Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: uptime-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y jq curl

      - name: Check all projects and update status.json
        shell: bash
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_KEY }}
        run: |
          set -uo pipefail

          STATUS_FILE="public/status.json"
          mkdir -p public

          if ! jq -e '.projects | type == "array"' "$STATUS_FILE" >/dev/null 2>&1; then
            printf '{"updated":"","projects":[]}\n' > "$STATUS_FILE"
          fi

          TMPFILE=$(mktemp)
          trap 'rm -f "$TMPFILE"' EXIT

          check_url() {
            local url="$1"
            local code="000"

            code=$(curl -L -sS -o /dev/null \
              --connect-timeout 5 \
              --max-time 15 \
              -w "%{http_code}" \
              "$url" 2>/dev/null) || true

            if [[ "$code" =~ ^[0-9]{3}$ ]] && (( 10#$code >= 200 && 10#$code < 400 )); then
              printf "Up"
            else
              printf "Down"
            fi
          }

          check_project() {
            local name="$1"
            local repo="$2"
            local site="$3"
            local repo_status
            local website_status
            local overall_status
            local previous_repo
            local previous_website

            repo_status=$(check_url "$repo")
            website_status=$(check_url "$site")

            if [[ "$repo_status" == "Up" && "$website_status" == "Up" ]]; then
              overall_status="Up"
            elif [[ "$repo_status" == "Down" || "$website_status" == "Down" ]]; then
              overall_status="Down"
            else
              overall_status="Unknown"
            fi

            previous_repo=$(jq -r --arg name "$name" \
              '[.projects[] | select(.name == $name) | (.repoStatus // .repositoryStatus // .repo_status // "Unknown")][0] // "Unknown"' \
              "$STATUS_FILE")

            previous_website=$(jq -r --arg name "$name" \
              '[.projects[] | select(.name == $name) | (.websiteStatus // .siteStatus // .website_status // "Unknown")][0] // "Unknown"' \
              "$STATUS_FILE")

            echo "$name: Repository=$repo_status, Website=$website_status"

            if [[ -n "${WEBHOOK_URL:-}" ]]; then
              if [[ "$previous_repo" != "Unknown" && "$repo_status" != "$previous_repo" ]]; then
                curl -sS --max-time 10 -X POST "$WEBHOOK_URL" \
                  -H "Content-Type: application/json" \
                  -d "$(jq -n \
                    --arg project "$name" \
                    --arg component "Repository" \
                    --arg status "$repo_status" \
                    --arg previous "$previous_repo" \
                    --arg url "$repo" \
                    '{project:$project,component:$component,status:$status,previous:$previous,url:$url}')" \
                  >/dev/null || true
              fi

              if [[ "$previous_website" != "Unknown" && "$website_status" != "$previous_website" ]]; then
                curl -sS --max-time 10 -X POST "$WEBHOOK_URL" \
                  -H "Content-Type: application/json" \
                  -d "$(jq -n \
                    --arg project "$name" \
                    --arg component "Website" \
                    --arg status "$website_status" \
                    --arg previous "$previous_website" \
                    --arg url "$site" \
                    '{project:$project,component:$component,status:$status,previous:$previous,url:$url}')" \
                  >/dev/null || true
              fi
            fi

            jq \
              --arg name "$name" \
              --arg repo "$repo" \
              --arg url "$site" \
              --arg repoStatus "$repo_status" \
              --arg websiteStatus "$website_status" \
              --arg status "$overall_status" \
              '.projects = (
                [.projects[] | select(.name != $name)] +
                [{
                  name: $name,
                  repo: $repo,
                  url: $url,
                  repoStatus: $repoStatus,
                  websiteStatus: $websiteStatus,
                  status: $status
                }]
              )' "$STATUS_FILE" > "$TMPFILE" && mv "$TMPFILE" "$STATUS_FILE"
          }

          check_project "Apps" "https://github.com/AC1DST4R/Apps" "https://ac1dst4r.github.io/Apps/"
          check_project "Web Ports" "https://github.com/AC1DST4R/Web-Ports" "https://ac1dst4r.github.io/Web-Ports/"
          check_project "Minecraft" "https://github.com/AC1DST4R/Minecraft" "https://ac1dst4r.github.io/Minecraft/"
          check_project "A-90" "https://github.com/AC1DST4R/90" "https://ac1dst4r.github.io/90/"
          check_project "A-90b" "https://github.com/AC1DST4R/a90b" "https://ac1dst4r.github.io/a90b/"
          check_project "MineSwept" "https://github.com/AC1DST4R/MineSwept" "https://ac1dst4r.github.io/MineSwept/"
          check_project "Black Knife" "https://github.com/AC1DST4R/Black_Knife" "https://ac1dst4r.github.io/Black_Knife/"
          check_project "File Encoder V2" "https://github.com/AC1DST4R/FileEncoderV2" "https://ac1dst4r.github.io/FileEncoderV2/"
          check_project "Downloads" "https://github.com/AC1DST4R/Downloads" "https://ac1dst4r.github.io/Downloads/"
          check_project "Camera Pro V2" "https://github.com/AC1DST4R/Camera-Pro-v2" "https://ac1dst4r.github.io/Camera-Pro-v2/"
          check_project "Super Awesome Clicker" "https://github.com/AC1DST4R/Super-Aw3some-clicker-game" "https://ac1dst4r.github.io/Super-Aw3some-clicker-game/"
          check_project "Memorize by Heart" "https://github.com/AC1DST4R/Memorizebyheart" "https://ac1dst4r.github.io/Memorizebyheart/"
          check_project "GitHub Stats" "https://github.com/AC1DST4R/GitHub-Stats" "https://ac1dst4r.github.io/GitHub-Stats/"
          check_project "Audio Visualizer" "https://github.com/AC1DST4R/Audio-Visualizer" "https://ac1dst4r.github.io/Audio-Visualizer/"
          check_project "File Creator" "https://github.com/AC1DST4R/File-Creator" "https://ac1dst4r.github.io/File-Creator/"
          check_project "GitChat V1" "https://github.com/AC1DST4R/GitChatV1" "https://ac1dst4r.github.io/GitChatV1/"
          check_project "History Autoclear" "https://github.com/AC1DST4R/History-Autoclear-Extension-V1.2" "https://ac1dst4r.github.io/History-Autoclear-Extension-V1.2/"
          check_project "Graphite V1" "https://github.com/AC1DST4R/Graphite-v1.0" "https://ac1dst4r.github.io/Graphite-v1.0/"
          check_project "Service Hour Tracker" "https://github.com/AC1DST4R/Service-Hour-Tracker" "https://ac1dst4r.github.io/Service-Hour-Tracker/"
          check_project "Webhooked" "https://github.com/AC1DST4R/Webhooked" "https://ac1dst4r.github.io/Webhooked/"
          check_project "Website Down Detector" "https://github.com/AC1DST4R/Website-Down-Detector" "https://ac1dst4r.github.io/Website-Down-Detector/"

          jq --arg updated "$(date -u +%FT%TZ)" \
            '.updated = $updated' "$STATUS_FILE" > "$TMPFILE" && mv "$TMPFILE" "$STATUS_FILE"

      - name: Commit status.json
        shell: bash
        run: |
          git config user.name "uptime-bot"
          git config user.email "uptime-bot@users.noreply.github.com"
          git add public/status.json

          if git diff --cached --quiet; then
            echo "No status changes to commit."
            exit 0
          fi

          git commit -m "Update uptime status"
          git push
